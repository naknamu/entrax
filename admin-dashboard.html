<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Dashboard - Exam Platform">
  <title>Admin Dashboard - Exam Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header no-print">
    <div class="container header-inner">
      <a href="admin-dashboard.html" class="logo" aria-label="Exam Platform Home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        Exam Platform
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="admin-dashboard.html" class="nav-link active" aria-current="page">Dashboard</a>
        <a href="create-exam.html" class="nav-link">Create Exam</a>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Sign Out</button>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <header class="page-header">
        <h1 class="page-title">Admin Dashboard</h1>
        <p class="page-subtitle">Manage exams and view student results</p>
      </header>

      <div id="alert-container"></div>

      <!-- Stats Cards -->
      <div class="stats-grid" aria-label="Dashboard statistics">
        <article class="card stat-card">
          <div class="stat-icon primary" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-value" id="stat-exams">0</span>
            <span class="stat-label">Total Exams</span>
          </div>
        </article>
        <article class="card stat-card">
          <div class="stat-icon success" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-value" id="stat-attempts">0</span>
            <span class="stat-label">Total Attempts</span>
          </div>
        </article>
        <article class="card stat-card">
          <div class="stat-icon warning" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-value" id="stat-avg-score">0%</span>
            <span class="stat-label">Avg Score</span>
          </div>
        </article>
        <article class="card stat-card">
          <div class="stat-icon danger" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-value" id="stat-pass-rate">0%</span>
            <span class="stat-label">Pass Rate</span>
          </div>
        </article>
      </div>

      <!-- Exams Table -->
      <section class="card" aria-labelledby="exams-heading">
        <header class="card-header">
          <div class="flex items-center justify-between flex-wrap gap-3">
            <h2 class="card-title" id="exams-heading">All Exams</h2>
            <a href="create-exam.html" class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Create New Exam
            </a>
          </div>
        </header>
        <div class="filters-card">
          <div class="filters-grid">
            <div class="filter-group form-group">
              <label class="label" for="exam-search">Search Exams</label>
              <input type="search" id="exam-search" class="input" placeholder="Search by title or description..." aria-label="Search exams">
            </div>
            <div class="filter-group form-group">
              <label class="label" for="exam-status-filter">Status</label>
              <select id="exam-status-filter" class="select">
                <option value="">All Statuses</option>
                <option value="published">Published</option>
                <option value="draft">Draft</option>
              </select>
            </div>
            <div class="filter-group filter-group--sm form-group">
              <label class="label" for="exam-page-size">Per Page</label>
              <select id="exam-page-size" class="select">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
              </select>
            </div>
          </div>
        </div>
        <div class="table-container">
          <table class="table" id="exams-table" role="grid">
            <thead>
              <tr>
                <th scope="col"><button type="button" class="th-sort" data-sort="title">Exam Title <span class="sort-icon" aria-hidden="true"></span></button></th>
                <th scope="col"><button type="button" class="th-sort" data-sort="questions">Questions <span class="sort-icon" aria-hidden="true"></span></button></th>
                <th scope="col"><button type="button" class="th-sort" data-sort="timeLimitMinutes">Time Limit <span class="sort-icon" aria-hidden="true"></span></button></th>
                <th scope="col"><button type="button" class="th-sort" data-sort="passingPercent">Passing % <span class="sort-icon" aria-hidden="true"></span></button></th>
                <th scope="col"><button type="button" class="th-sort" data-sort="availability">Availability <span class="sort-icon" aria-hidden="true"></span></button></th>
                <th scope="col"><button type="button" class="th-sort" data-sort="attempts">Attempts <span class="sort-icon" aria-hidden="true"></span></button></th>
                <th scope="col"><button type="button" class="th-sort" data-sort="avgScore">Avg Score <span class="sort-icon" aria-hidden="true"></span></button></th>
                <th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="exams-tbody">
              <tr>
                <td colspan="8" class="text-center py-8 text-muted">Loading exams...</td>
              </tr>
            </tbody>
          </table>
        </div>
        <footer class="table-footer">
          <span class="pagination-info" id="pagination-info"></span>
          <nav class="pagination" id="pagination-nav" aria-label="Exam pagination"></nav>
        </footer>
      </section>
    </div>
  </main>

  <!-- Exam Read-Only View Modal -->
  <div class="modal-overlay" id="exam-view-modal" role="dialog" aria-modal="true" aria-labelledby="view-modal-title" hidden>
    <div class="modal modal--lg">
      <header class="modal-header">
        <h3 class="modal-title" id="view-modal-title">Exam Details</h3>
        <button type="button" class="btn btn-ghost btn-sm" id="view-modal-close" aria-label="Close exam details">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </header>
      <div class="modal-body" id="view-modal-body"></div>
      <footer class="modal-footer">
        <a class="btn btn-outline" id="view-modal-edit" href="#">Edit Exam</a>
        <button type="button" class="btn btn-primary" id="view-modal-done">Done</button>
      </footer>
    </div>
  </div>

  <script type="module">
    import { auth, db } from '/src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { collection, query, where, getDocs, getCountFromServer, doc, deleteDoc, updateDoc, writeBatch, serverTimestamp } from 'firebase/firestore';
    import { formatDate, formatDateTime, formatDuration, showAlert, showConfirm, formatPercent, escapeHtml } from '/js/admin.js';

    // DOM Elements
    const logoutBtn = document.getElementById('logout-btn');
    const examsTbody = document.getElementById('exams-tbody');
    const alertContainer = document.getElementById('alert-container');
    const statExams = document.getElementById('stat-exams');
    const statAttempts = document.getElementById('stat-attempts');
    const statAvgScore = document.getElementById('stat-avg-score');
    const statPassRate = document.getElementById('stat-pass-rate');

    // View modal elements
    const examViewModal = document.getElementById('exam-view-modal');
    const viewModalTitle = document.getElementById('view-modal-title');
    const viewModalBody = document.getElementById('view-modal-body');
    const viewModalEdit = document.getElementById('view-modal-edit');
    const viewModalClose = document.getElementById('view-modal-close');
    const viewModalDone = document.getElementById('view-modal-done');

    // Toolbar / pagination elements
    const examSearch = document.getElementById('exam-search');
    const examStatusFilter = document.getElementById('exam-status-filter');
    const examPageSize = document.getElementById('exam-page-size');
    const paginationInfo = document.getElementById('pagination-info');
    const paginationNav = document.getElementById('pagination-nav');

    // State
    let allExams = [];
    let allSubmissions = [];
    let attemptsMap = {};
    let avgScoreMap = {};
    const tableState = { search: '', status: '', sortField: 'title', sortDir: 'asc', page: 1, pageSize: 10 };

    // Auth check
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      await loadDashboard();
    });

    // Logout
    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      window.location.href = 'index.html';
    });

    async function loadDashboard() {
      try {
        // Load exams (no orderBy: Firestore's orderBy excludes documents missing
        // the field, which hid draft exams without createdAt; sort client-side
        // and fall back to updatedAt for older drafts).
        const examsSnapshot = await getDocs(collection(db, 'exams'));
        const exams = examsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        allExams = exams;
        const examTime = (e) => {
          if (e.createdAt && e.createdAt.toMillis) return e.createdAt.toMillis();
          if (e.updatedAt && e.updatedAt.toMillis) return e.updatedAt.toMillis();
          return 0;
        };
        exams.sort((a, b) => examTime(b) - examTime(a));

        // Load all submissions for stats
        const submissionsSnapshot = await getDocs(collection(db, 'submissions'));
        const submissions = submissionsSnapshot.docs.map(doc => doc.data());
        allSubmissions = submissions;

        // Per-exam stats maps
        attemptsMap = {};
        avgScoreMap = {};
        allSubmissions.forEach(s => {
          const id = s.examId;
          attemptsMap[id] = (attemptsMap[id] || 0) + 1;
          const prev = avgScoreMap[id] || { sum: 0, count: 0 };
          prev.sum += (s.percentage || 0);
          prev.count++;
          avgScoreMap[id] = prev;
        });

        // Calculate stats
        const totalExams = exams.length;
        const totalAttempts = submissions.length;
        const avgScore = totalAttempts > 0 
          ? submissions.reduce((sum, s) => sum + (s.percentage || 0), 0) / totalAttempts 
          : 0;
        const passRate = totalAttempts > 0
          ? (submissions.filter(s => s.passed).length / totalAttempts) * 100
          : 0;

        statExams.textContent = totalExams;
        statAttempts.textContent = totalAttempts;
        statAvgScore.textContent = formatPercent(avgScore);
        statPassRate.textContent = formatPercent(passRate);

        // Render exams table (filtered, sorted, paginated)
        applyExamsTable();
      } catch (error) {
        console.error('Error loading dashboard:', error);
        showAlert(alertContainer, 'Failed to load dashboard. Please refresh.', 'error');
      }
    }

    // Sort keys for each column (returns a comparable value)
    function examSortKey(exam, field) {
      switch (field) {
        case 'title': return (exam.title || '').toLowerCase();
        case 'questions': return exam.questions?.length || 0;
        case 'timeLimitMinutes': return exam.timeLimitMinutes || 0;
        case 'passingPercent': return exam.passingPercent || 70;
        case 'availability': {
          const now = new Date();
          const start = exam.startDate?.toDate ? exam.startDate.toDate() : (exam.startDate ? new Date(exam.startDate) : null);
          const end = exam.endDate?.toDate ? exam.endDate.toDate() : (exam.endDate ? new Date(exam.endDate) : null);
          if (end && end < now) return 0;                 // closed
          if (start && start > now) return 2;             // opens later
          return 1;                                       // open / closes later
        }
        case 'attempts': return attemptsMap[exam.id] || 0;
        case 'avgScore': {
          const a = avgScoreMap[exam.id];
          return a && a.count ? a.sum / a.count : 0;
        }
        default: return 0;
      }
    }

    function applyExamsTable() {
      // Filter
      const q = tableState.search.trim().toLowerCase();
      let filtered = allExams.filter(exam => {
        if (tableState.status && exam.status !== tableState.status) return false;
        if (q) {
          const hay = `${exam.title || ''} ${exam.description || ''}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      // Sort
      const field = tableState.sortField;
      const dir = tableState.sortDir === 'desc' ? -1 : 1;
      filtered.sort((a, b) => {
        const ka = examSortKey(a, field);
        const kb = examSortKey(b, field);
        if (ka < kb) return -1 * dir;
        if (ka > kb) return 1 * dir;
        return 0;
      });

      // Paginate
      const total = filtered.length;
      const pages = Math.max(1, Math.ceil(total / tableState.pageSize));
      if (tableState.page > pages) tableState.page = pages;
      const start = (tableState.page - 1) * tableState.pageSize;
      const pageExams = filtered.slice(start, start + tableState.pageSize);

      renderTableRows(pageExams, total);
      renderPagination(pages, total, start);
      renderSortIndicators();
    }

    function renderTableRows(pageExams, total) {
      if (allExams.length === 0) {
        examsTbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-8 text-muted">
              No exams created yet. <a href="create-exam.html" class="text-primary">Create your first exam</a>
            </td>
          </tr>
        `;
        return;
      }
      if (pageExams.length === 0) {
        examsTbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-8 text-muted">No exams match your filters.</td>
          </tr>
        `;
        return;
      }

      examsTbody.innerHTML = pageExams.map(exam => {
        const attempts = attemptsMap[exam.id] || 0;
        const avg = avgScoreMap[exam.id];
        const avgScore = avg && avg.count ? avg.sum / avg.count : 0;

        // Availability
        const now = new Date();
        const startDate = exam.startDate?.toDate ? exam.startDate.toDate() : (exam.startDate ? new Date(exam.startDate) : null);
        const endDate = exam.endDate?.toDate ? exam.endDate.toDate() : (exam.endDate ? new Date(exam.endDate) : null);
        let availability = 'Always Open';
        let availabilityClass = 'success';
        if (startDate && startDate > now) {
          availability = `Opens ${formatDate(startDate)}`;
          availabilityClass = 'warning';
        } else if (endDate && endDate < now) {
          availability = `Closed ${formatDate(endDate)}`;
          availabilityClass = 'danger';
        } else if (endDate) {
          availability = `Closes ${formatDate(endDate)}`;
          availabilityClass = 'warning';
        }

        return `
          <tr class="exam-row" data-exam-id="${exam.id}" tabindex="0" role="button" aria-label="View ${escapeHtml(exam.title)}">
            <td>
              <div class="exam-title">${escapeHtml(exam.title)}${exam.status === 'draft' ? ' <span class="badge badge-secondary">Draft</span>' : ''}</div>
              <div class="exam-description">${escapeHtml(exam.description || 'No description')}</div>
            </td>
            <td>${exam.questions?.length || 0}</td>
            <td>${exam.timeLimitMinutes} min</td>
            <td>${exam.passingPercent || 70}%</td>
            <td><span class="badge badge-${availabilityClass}">${availability}</span></td>
            <td>${attempts}</td>
            <td>${formatPercent(avgScore)}</td>
            <td>
              <div class="dropdown" data-exam-id="${exam.id}">
                <button type="button" class="btn btn-sm btn-outline actions-toggle" aria-label="Actions for ${escapeHtml(exam.title)}" aria-haspopup="true" aria-expanded="false">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                </button>
                <div class="dropdown-menu" role="menu">
                  <button class="dropdown-item" data-action="view" role="menuitem">View Exam</button>
                  <a class="dropdown-item" href="exam-results.html?examId=${exam.id}" role="menuitem">Results</a>
                  <a class="dropdown-item" href="create-exam.html?examId=${exam.id}" role="menuitem">Edit</a>
                  <button class="dropdown-item" data-action="copy" role="menuitem">Copy Link</button>
                  ${exam.status === 'draft' ? '<button class="dropdown-item" data-action="publish" role="menuitem">Publish</button>' : ''}
                  <div class="dropdown-divider" role="separator"></div>
                  <button class="dropdown-item danger" data-action="delete" role="menuitem">Delete</button>
                </div>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderPagination(pages, total, start) {
      const from = total === 0 ? 0 : start + 1;
      const to = Math.min(total, start + tableState.pageSize);
      paginationInfo.textContent = total === 0 ? '0 exams' : `Showing ${from}–${to} of ${total}`;

      if (pages <= 1) {
        paginationNav.innerHTML = '';
        return;
      }

      const btn = (label, page, opts = {}) =>
        `<button type="button" class="page-btn ${opts.active ? 'active' : ''}" data-page="${page}" ${opts.disabled ? 'disabled' : ''}>${label}</button>`;

      let html = btn('‹ Prev', tableState.page - 1, { disabled: tableState.page === 1 });
      const windowPages = [];
      const maxBtns = 7;
      let startP = Math.max(1, tableState.page - 2);
      let endP = Math.min(pages, startP + maxBtns - 1);
      startP = Math.max(1, endP - maxBtns + 1);
      if (startP > 1) windowPages.push('…' + '1');
      for (let p = startP; p <= endP; p++) windowPages.push(String(p));
      if (endP < pages) windowPages.push(String(pages) + '…');
      // Rebuild with proper first/last page links + ellipsis markers
      html += windowPages.map(seg => {
        if (seg.startsWith('…')) return btn(seg.slice(1), 1, { active: tableState.page === 1 });
        if (seg.endsWith('…')) return btn(seg.slice(0, -1), pages, { active: tableState.page === pages });
        return btn(seg, Number(seg), { active: tableState.page === Number(seg) });
      }).join('');
      html += btn('Next ›', tableState.page + 1, { disabled: tableState.page === pages });

      paginationNav.innerHTML = html;
    }

    function renderSortIndicators() {
      document.querySelectorAll('#exams-table th').forEach(th => {
        const btn = th.querySelector('.th-sort');
        if (!btn) return;
        const active = btn.dataset.sort === tableState.sortField;
        th.setAttribute('aria-sort', active ? (tableState.sortDir === 'asc' ? 'ascending' : 'descending') : 'none');
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    // Make deleteExam globally accessible
    window.deleteExam = async function(examId, title) {
      const confirmed = await showConfirm('Delete Exam', `Are you sure you want to delete "${title}"? This will also delete all student submissions for this exam.`);
      if (!confirmed) return;

      try {
        // Delete exam
        await deleteDoc(doc(db, 'exams', examId));
        
        // Delete associated submissions (batch delete)
        const submissionsQuery = query(collection(db, 'submissions'), where('examId', '==', examId));
        const submissionsSnapshot = await getDocs(submissionsQuery);
        const batch = writeBatch(db);
        submissionsSnapshot.docs.forEach(doc => batch.delete(doc.ref));
        await batch.commit();

        showAlert(alertContainer, 'Exam deleted successfully.', 'success');
        loadDashboard();
      } catch (error) {
        console.error('Error deleting exam:', error);
        showAlert(alertContainer, 'Failed to delete exam.', 'error');
      }
    };

    // ---------- Actions dropdown ----------
    function closeAllDropdowns(exceptEl) {
      document.querySelectorAll('.dropdown.open').forEach(d => {
        if (exceptEl && d === exceptEl) return;
        d.classList.remove('open');
        const btn = d.querySelector('.actions-toggle');
        if (btn) btn.setAttribute('aria-expanded', 'false');
        // Clear fixed-position inline styles
        const menuEl = d.querySelector('.dropdown-menu');
        if (menuEl) {
          menuEl.style.position = '';
          menuEl.style.top = '';
          menuEl.style.right = '';
          menuEl.style.left = '';
          menuEl.style.bottom = '';
        }
      });
    }

    // Open a row-actions dropdown. Uses position:fixed so the menu is not
    // clipped by the table container's overflow (which otherwise hides it
    // behind the pagination footer and adds a scrollbar on the last row).
    // Always opens directly below the button (no animation, no flipping).
    function openDropdown(menu) {
      const btn = menu.querySelector('.actions-toggle');
      const menuEl = menu.querySelector('.dropdown-menu');
      if (!btn || !menuEl) return;

      menu.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');

      const rect = btn.getBoundingClientRect();
      menuEl.style.position = 'fixed';
      menuEl.style.top = `${rect.bottom + 4}px`;
      menuEl.style.right = `${Math.max(8, window.innerWidth - rect.right)}px`;
      menuEl.style.left = 'auto';
      menuEl.style.bottom = 'auto';

      // Repositioned menu is stale after scroll/resize -> close it
      const close = () => { closeAllDropdowns(); window.removeEventListener('scroll', close, true); window.removeEventListener('resize', close); };
      window.addEventListener('scroll', close, true);
      window.addEventListener('resize', close);
    }

    // ---------- Publish (one-click) ----------
    window.publishExam = async function(examId, title) {
      const confirmed = await showConfirm('Publish Exam', `Publish "${title}"? Students will be able to take it.`);
      if (!confirmed) return;
      try {
        await updateDoc(doc(db, 'exams', examId), { status: 'published', updatedAt: serverTimestamp() });
        showAlert(alertContainer, 'Exam published successfully.', 'success');
        loadDashboard();
      } catch (error) {
        console.error('Error publishing exam:', error);
        showAlert(alertContainer, 'Failed to publish exam.', 'error');
      }
    };

    // ---------- Read-only exam view ----------
    function openViewExam(examId) {
      const exam = allExams.find(e => e.id === examId);
      if (!exam) return;

      viewModalTitle.textContent = exam.title;
      viewModalEdit.href = `create-exam.html?examId=${exam.id}`;

      const now = new Date();
      const startDate = exam.startDate?.toDate ? exam.startDate.toDate() : (exam.startDate ? new Date(exam.startDate) : null);
      const endDate = exam.endDate?.toDate ? exam.endDate.toDate() : (exam.endDate ? new Date(exam.endDate) : null);
      let availability = 'Always Open';
      let availabilityClass = 'success';
      if (startDate && startDate > now) {
        availability = `Opens ${formatDate(startDate)}`;
        availabilityClass = 'warning';
      } else if (endDate && endDate < now) {
        availability = `Closed ${formatDate(endDate)}`;
        availabilityClass = 'danger';
      } else if (endDate) {
        availability = `Closes ${formatDate(endDate)}`;
        availabilityClass = 'warning';
      }

      const statusBadge = exam.status === 'draft'
        ? '<span class="badge badge-secondary">Draft</span>'
        : '<span class="badge badge-success">Published</span>';

      const meta = `
        <div class="view-exam-meta">
          ${statusBadge}
          <span class="badge badge-primary">${exam.questions?.length || 0} Questions</span>
          <span class="badge badge-secondary">${exam.timeLimitMinutes} min</span>
          <span class="badge badge-secondary">Passing: ${exam.passingPercent || 70}%</span>
          <span class="badge badge-${availabilityClass}">${availability}</span>
        </div>
      `;

      const questionsHtml = (exam.questions || []).map((q, qIndex) => {
        const choicesHtml = (q.choices || []).map((choice, cIndex) => `
          <div class="answer-choice ${cIndex === q.correctIndex ? 'correct' : ''}">
            <span class="answer-choice-letter">${String.fromCharCode(65 + cIndex)}</span>
            <span class="answer-choice-text">${escapeHtml(choice)}</span>
            ${cIndex === q.correctIndex ? '<span class="answer-choice-label">(Correct Answer)</span>' : ''}
          </div>
        `).join('');

        return `
          <article class="answer-item">
            <header class="answer-header">
              <div class="answer-question">
                <span class="answer-question-number">Q${qIndex + 1}.</span>
                <span class="answer-question-text">${escapeHtml(q.text)}</span>
                ${q.category ? `<span class="answer-question-category">${escapeHtml(q.category)}</span>` : ''}
              </div>
            </header>
            <div class="answer-choices">${choicesHtml}</div>
          </article>
        `;
      }).join('');

      viewModalBody.innerHTML = `
        <p class="view-exam-desc">${escapeHtml(exam.description || 'No description provided.')}</p>
        ${meta}
        <h4 class="view-exam-questions-title">Questions</h4>
        <div class="answer-breakdown">${questionsHtml || '<p class="text-muted">This exam has no questions yet.</p>'}</div>
      `;

      examViewModal.hidden = false;
      examViewModal.classList.add('open');
    }

    function closeViewExam() {
      examViewModal.classList.remove('open');
      examViewModal.hidden = true;
    }

    // ---------- Delegated interactions ----------
    document.addEventListener('click', async (e) => {
      // Dropdown toggle
      const toggle = e.target.closest('.actions-toggle');
      if (toggle) {
        e.stopPropagation();
        const menu = toggle.closest('.dropdown');
        const willOpen = !menu.classList.contains('open');
        closeAllDropdowns();
        if (willOpen) openDropdown(menu);
        return;
      }

      // Dropdown menu items
      const item = e.target.closest('.dropdown-item');
      if (item) {
        e.stopPropagation();
        const menu = item.closest('.dropdown');
        const examId = menu.dataset.examId;
        const examTitle = allExams.find(x => x.id === examId)?.title || 'this exam';
        const action = item.dataset.action;
        if (action) {
          if (action === 'view') {
            openViewExam(examId);
          } else if (action === 'publish') {
            await window.publishExam(examId, examTitle);
          } else if (action === 'copy') {
            const link = `${new URL('exam.html', window.location.href).href}?examId=${examId}`;
            try {
              await navigator.clipboard.writeText(link);
              showAlert(alertContainer, 'Exam link copied to clipboard!', 'success');
            } catch (error) {
              showAlert(alertContainer, 'Failed to copy link.', 'error');
            }
          } else if (action === 'delete') {
            await window.deleteExam(examId, examTitle);
          }
        }
        closeAllDropdowns();
        return;
      }

      // Row click -> read-only view (ignore clicks on links/buttons)
      if (!e.target.closest('a, button')) {
        const row = e.target.closest('.exam-row');
        if (row) openViewExam(row.dataset.examId);
      }

      // Click outside a dropdown closes it
      if (!e.target.closest('.dropdown')) closeAllDropdowns();
    });

    // Keyboard: Enter/Space on a row opens the read-only view
    document.addEventListener('keydown', (e) => {
      const row = e.target.closest && e.target.closest('.exam-row');
      if (row && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        openViewExam(row.dataset.examId);
      }
    });

    // Modal close
    viewModalClose.addEventListener('click', closeViewExam);
    viewModalDone.addEventListener('click', closeViewExam);
    examViewModal.addEventListener('click', (e) => {
      if (e.target === examViewModal) closeViewExam();
    });

    // ---------- Search / filter / sort / pagination ----------
    let searchTimer = null;
    examSearch.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        tableState.search = examSearch.value;
        tableState.page = 1;
        applyExamsTable();
      }, 200);
    });

    examStatusFilter.addEventListener('change', () => {
      tableState.status = examStatusFilter.value;
      tableState.page = 1;
      applyExamsTable();
    });

    examPageSize.addEventListener('change', () => {
      tableState.pageSize = parseInt(examPageSize.value, 10) || 10;
      tableState.page = 1;
      applyExamsTable();
    });

    document.querySelectorAll('.th-sort').forEach(btn => {
      btn.addEventListener('click', () => {
        const field = btn.dataset.sort;
        if (tableState.sortField === field) {
          tableState.sortDir = tableState.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          tableState.sortField = field;
          tableState.sortDir = 'asc';
        }
        tableState.page = 1;
        applyExamsTable();
      });
    });

    paginationNav.addEventListener('click', (e) => {
      const btn = e.target.closest('.page-btn');
      if (!btn || btn.disabled) return;
      tableState.page = parseInt(btn.dataset.page, 10);
      applyExamsTable();
    });
  </script>
</body>
</html>
