name: Firestore Backup

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: 'GCS bucket for backup export'
        required: true
        default: ${{ vars.FIRESTORE_BACKUP_BUCKET }}

env:
  NODE_VERSION: '20'

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Export Firestore backup to GCS
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          BUCKET: ${{ github.event.inputs.bucket || vars.FIRESTORE_BACKUP_BUCKET }}
        run: |
          # Authenticate gcloud with the service account for the export destination.
          echo "${GCP_SA_KEY}" | gcloud auth activate-service-account --key-file=-
          firebase firestore:export gs://${BUCKET}/$(date +%Y%m%d_%H%M%S) \
            --project entrax-878a1 --token "${FIREBASE_TOKEN}"
