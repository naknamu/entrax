# CI/CD — fully automated: every push to main builds the site and deploys
# BOTH the GitHub Pages site and the Firestore rules+indexes.
# Pull requests run the build as a gate (no deployment).
#
# E2E tests (Playwright + emulators) are run locally before pushing.
# (The Firestore deploy uses the FIREBASE_TOKEN secret — see README/notes.)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pages deployment requires these permissions
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel superseded runs for the same branch/PR (keep the latest only)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build the production bundle
  # ---------------------------------------------------------------------------
  build:
    name: Build (production)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_EMULATOR: 'false'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ---------------------------------------------------------------------------
  # CD: deploy the built site to GitHub Pages (push to main only). No checkout
  # or npm ci needed — it just publishes the artifact from the build job.
  # ---------------------------------------------------------------------------
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # CD: deploy Firestore rules + indexes to production (push to main only).
  # Uses the prebuilt firebase-action Docker image so no npm ci is needed.
  # Requires the FIREBASE_TOKEN secret (generate with `npx firebase login:ci`).
  # Runs in parallel with the Pages deploy.
  # ---------------------------------------------------------------------------
  deploy-firestore:
    name: Deploy Firestore Rules + Indexes
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if Firestore config changed
        id: firestore-changed
        run: |
          BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "$(git rev-list --max-parents=0 HEAD)")
          if git diff --name-only "$BASE" HEAD | grep -qE '^firestore\.(rules|indexes\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Firestore rules and indexes
        if: steps.firestore-changed.outputs.changed == 'true'
        uses: w9jds/firebase-action@v15.25.1
        with:
          args: deploy --only firestore:rules,firestore:indexes --project entrax-878a1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
