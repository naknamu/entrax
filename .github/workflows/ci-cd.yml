# CI/CD — fully automated: every push to main runs the E2E suite, builds the
# site, and deploys BOTH the GitHub Pages site and the Firestore rules+indexes.
# Pull requests run the same tests + build as a gate (no deployment).
#
# No manual jobs needed: push to main and the pipeline handles the rest.
# (The Firestore deploy uses the FIREBASE_TOKEN secret — see README/notes.)
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pages deployment requires these permissions
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel superseded runs for the same branch/PR (keep the latest only)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # CI gate: Playwright E2E tests against Firebase emulators
  # ---------------------------------------------------------------------------
  test:
    name: E2E Tests (Playwright + Emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Java (Firestore emulator requires JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase
          key: firebase-emulators-${{ runner.os }}

      # Pre-download the emulator binaries so the test step never has to wait on
      # a cold download (first run only; cached on later runs).
      - name: Download Firebase emulators
        run: |
          npx firebase setup:emulators:firestore
          npx firebase setup:emulators:ui

      # Emulators + seed + tests run in ONE step so the backgrounded emulator
      # process lives for the whole test run (each step is a fresh shell).
      - name: Run E2E tests against emulators
        run: |
          set -e
          java -version > java-info.txt 2>&1 || true
          npx firebase emulators:start --only auth,firestore --project demo-test > emulators.log 2>&1 &
          EMULATOR_PID=$!
          trap 'kill $EMULATOR_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8081/ >/dev/null 2>&1 && curl -sf http://localhost:9099/ >/dev/null 2>&1; then
              echo "emulators ready (${i}x5s)"
              break
            fi
            sleep 5
            if [ "$i" = 120 ]; then
              echo "emulators did not start in time:"
              tail -100 emulators.log
              exit 1
            fi
          done
          node tests/seed-test-data.cjs
          npx playwright test
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8081
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099

      # Surface diagnostics as check-run annotations (readable from the API)
      - name: Emulator diagnostics (debug)
        if: failure()
        run: |
          for f in emulators.log firestore-debug.log java-info.txt; do
            if [ -f "$f" ]; then
              echo "::error::===== $f ====="
              head -c 8000 "$f" | while IFS= read -r line; do echo "::error::$line"; done
            fi
          done

      - name: Upload emulator log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulators-log
          path: emulators.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Build the production bundle (gated on green tests)
  # ---------------------------------------------------------------------------
  build:
    name: Build (production)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_EMULATOR: 'false'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ---------------------------------------------------------------------------
  # CD: deploy the built site to GitHub Pages (push to main only). No checkout
  # or npm ci needed — it just publishes the artifact from the build job.
  # ---------------------------------------------------------------------------
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # CD: deploy Firestore rules + indexes to production (push to main only).
  # Uses the prebuilt firebase-action Docker image so no npm ci is needed.
  # Requires the FIREBASE_TOKEN secret (generate with `npx firebase login:ci`).
  # Runs in parallel with the Pages deploy.
  # ---------------------------------------------------------------------------
  deploy-firestore:
    name: Deploy Firestore Rules + Indexes
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if Firestore config changed
        id: firestore-changed
        run: |
          BASE=$(git rev-parse HEAD^ 2>/dev/null || echo "$(git rev-list --max-parents=0 HEAD)")
          if git diff --name-only "$BASE" HEAD | grep -qE '^firestore\.(rules|indexes\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Firestore rules and indexes
        if: steps.firestore-changed.outputs.changed == 'true'
        uses: w9jds/firebase-action@v15.25.1
        with:
          args: deploy --only firestore:rules,firestore:indexes --project entrax-878a1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
