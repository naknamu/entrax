name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── Build + deploy GitHub Pages ──────────────────────────────────────────
  build-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      rules_changed: ${{ steps.diff.outputs.rules_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Depth 2 so HEAD^ resolves for the rules-change diff check.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite injects Firebase env from secrets)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_EMULATOR: 'false'
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # ── Detect whether firestore.rules or firestore.indexes.json changed ──
      - name: Detect rules/indexes changes
        id: diff
        run: |
          if git diff --quiet HEAD^ HEAD -- firestore.rules firestore.indexes.json; then
            echo "rules_changed=false" >> $GITHUB_OUTPUT
          else
            echo "rules_changed=true" >> $GITHUB_OUTPUT
          fi
        # If there is no parent commit (first push), treat as changed so rules deploy.
        if [ -z "$(git rev-parse --verify HEAD^ 2>/dev/null)" ]; then
          echo "rules_changed=true" >> $GITHUB_OUTPUT
        fi

  # ── Deploy Firestore rules / indexes ─────────────────────────────────────
  deploy-firestore:
    needs: build-deploy
    runs-on: ubuntu-latest
    if: needs.build-deploy.outputs.rules_changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules + indexes
        uses: w9jds/firebase-action@v2
        with:
          args: deploy --only firestore:rules,firestore:indexes --project entrax-878a1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # ── Playwright E2E tests against emulators ───────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (emulators)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 2
          command: npm run test:ci
        env:
          CI: 'true'
