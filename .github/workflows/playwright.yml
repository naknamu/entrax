name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Start Firebase Emulators
        uses: firebase/firebase-tools-action@v1
        with:
          command: emulators:start --only auth,firestore --project demo-test
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      
      - name: Wait for emulators
        run: |
          sleep 10
          curl -f http://localhost:9099/ || exit 1
          curl -f http://localhost:4000/ || exit 1
      
      - name: Seed test data
        run: |
          # Seed admin user and test data
          node tests/seed-test-data.js
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8081
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
      
      - name: Run Playwright tests
        run: npx playwright test
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8081
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # NOTE: No deploy job here — deploying is owned by .github/workflows/deploy.yml.
  # A second workflow uploading the raw repo root ('.') to Pages would race with
  # the real build (./dist) and overwrite the site with unbuilt source files.
